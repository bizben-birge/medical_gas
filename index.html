<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Медицинские газы — мониторинг</title>
<style>
  :root {
    --bg:        #e9edf1;
    --panel:     #ffffff;
    --ink:       #171c21;
    --ink-soft:  #5d6873;
    --rule:      #ccd4dc;
    --normal:    #17804a;
    --low:       #cc2222;
    --high:      #d9760a;
    --off:       #97a2ac;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }

  .wrap { max-width: 940px; margin: 0 auto; padding: 28px 20px 56px; }

  /* ---------- шапка ---------- */

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 26px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .link-state {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .pulse {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--normal);
    flex: none;
  }
  .pulse.stale { background: var(--high); }
  .pulse.down  { background: var(--low); }

  /* ---------- строка газа ---------- */

  .rows { display: flex; flex-direction: column; gap: 12px; }

  .gas {
    display: grid;
    grid-template-columns: 6px 1fr auto;
    gap: 0 22px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 18px 22px 18px 0;
  }

  .stripe { align-self: stretch; background: var(--off); }

  .label { display: flex; align-items: baseline; gap: 12px; margin-left: 22px; }

  .label .short { font-size: 19px; font-weight: 600; }
  .label .full  { color: var(--ink-soft); font-size: 14px; }

  .verdict {
    margin-left: auto;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .verdict.low    { color: var(--low); }
  .verdict.high   { color: var(--high); }
  .verdict.normal { color: var(--normal); }

  /* шкала с порогами */

  .scale {
    position: relative;
    height: 34px;
    margin: 14px 0 0 22px;
  }

  .track {
    position: absolute; left: 0; right: 0; top: 12px;
    height: 8px;
    background: #dde3e9;
  }

  .band {
    position: absolute; top: 12px; height: 8px;
    background: #bfe3cd;
  }

  .needle {
    position: absolute; top: 4px;
    width: 3px; height: 24px;
    background: var(--ink);
    transform: translateX(-1.5px);
    transition: left .5s ease;
  }

  .tick {
    position: absolute; top: 24px;
    font-size: 11.5px;
    color: var(--ink-soft);
    transform: translateX(-50%);
    white-space: nowrap;
  }

  .reading {
    text-align: right;
    display: flex;
    align-items: baseline;
    gap: 7px;
    justify-content: flex-end;
  }

  .reading .num {
    font-size: 46px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .reading .unit { color: var(--ink-soft); font-size: 15px; }

  .gas.low  .num { color: var(--low); }
  .gas.high .num { color: var(--high); }
  .gas.off  .num { color: var(--off); }
  .gas.off  .scale { opacity: .35; }

  /* ---------- график ---------- */

  .chart-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin: 36px 0 12px;
  }
  .chart-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; }

  canvas {
    width: 100%;
    height: 220px;
    background: var(--panel);
    border: 1px solid var(--rule);
    display: block;
  }

  .note { margin-top: 14px; color: var(--ink-soft); font-size: 13px; }

  .empty {
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 44px 22px;
    text-align: center;
    color: var(--ink-soft);
  }

  @media (max-width: 620px) {
    .gas { grid-template-columns: 6px 1fr; padding-right: 18px; }
    .reading { grid-column: 2; justify-content: flex-start; margin: 12px 0 0 22px; }
    .reading .num { font-size: 38px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .needle { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Медицинские газы</h1>
    <div class="link-state">
      <span class="pulse" id="pulse"></span>
      <span id="link-text">подключение…</span>
    </div>
  </header>

  <div class="rows" id="rows">
    <div class="empty">Ожидание первых данных от панели.</div>
  </div>

  <div class="chart-head">
    <h2>За последние сутки</h2>
    <div class="legend" id="legend"></div>
  </div>
  <canvas id="chart"></canvas>

  <p class="note" id="note"></p>

</div>

<script>
// ====================== НАСТРОЙКА ======================
// Тот же адрес, что в gateway.py, без слеша в конце.
const FIREBASE_URL = "https://medical-gas-a3384-default-rtdb.europe-west1.firebasedatabase.app";
const DEVICE_ID    = "panel-1";

const CURRENT_EVERY_MS = 3000;    // как часто обновлять показания
const HISTORY_EVERY_MS = 60000;   // как часто перерисовывать график
const STALE_AFTER_MS   = 90000;   // после этого данные считаем устаревшими
// =======================================================

const VERDICT = {
  normal: "в норме",
  low:    "ниже нижнего предела",
  high:   "выше верхнего предела",
  off:    "канал отключён"
};
const VERDICT_INV = {
  normal: "в норме",
  low:    "вакуум слабее нормы",
  high:   "вакуум глубже нормы",
  off:    "канал отключён"
};

const LINE_COLORS = ["#1f6fb2", "#17804a", "#8a4fbf", "#c07400"];

let latest = null;
let order  = [];

const $ = id => document.getElementById(id);

async function getJSON(path) {
  const r = await fetch(`${FIREBASE_URL}/${DEVICE_ID}/${path}.json?_=${Date.now()}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ---------- показания ----------

function renderRows(data) {
  const rows = $("rows");
    const PREFERRED = ["o2", "air", "co2", "vac"];
  const keys = PREFERRED.filter(k => data.channels[k])
    .concat(Object.keys(data.channels).filter(k => !PREFERRED.includes(k)));
  order = keys;

  rows.innerHTML = keys.map(key => {
    const c = data.channels[key];
    const state = c.state || "normal";

    // диапазон шкалы: пороги плюс запас, но всегда вмещаем текущее значение
    const span = Math.max(c.high - c.low, 0.1);
    const min  = Math.min(c.low - span * 0.6, c.value - span * 0.2, 0);
    const max  = Math.max(c.high + span * 0.6, c.value + span * 0.2);
    const pct  = v => ((v - min) / (max - min) * 100).toFixed(2);

    return `
      <div class="gas ${state}">
        <div class="stripe" style="background:${c.color || '#97a2ac'}"></div>
        <div>
          <div class="label">
            <span class="short">${c.short}</span>
            <span class="full">${c.name}</span>
            <span class="verdict ${state}">${(c.inverted ? VERDICT_INV : VERDICT)[state]}</span>
          </div>
          <div class="scale">
            <div class="track"></div>
            <div class="band" style="left:${pct(c.low)}%;width:${pct(c.high) - pct(c.low)}%"></div>
            <div class="needle" style="left:${Math.max(0, Math.min(100, pct(c.value)))}%"></div>
            <div class="tick" style="left:${pct(c.low)}%">${c.low.toFixed(2)}</div>
            <div class="tick" style="left:${pct(c.high)}%">${c.high.toFixed(2)}</div>
          </div>
        </div>
        <div class="reading">
          <span class="num">${c.value.toFixed(2)}</span>
          <span class="unit">${c.unit}</span>
        </div>
      </div>`;
  }).join("");

  $("legend").innerHTML = keys.map((key, i) =>
    `<span><i style="background:${LINE_COLORS[i % LINE_COLORS.length]}"></i>${data.channels[key].short}</span>`
  ).join("");
}

function renderLink(data, err) {
  const pulse = $("pulse");
  const text  = $("link-text");

  if (err) {
    pulse.className = "pulse down";
    text.textContent = "нет связи с облаком";
    return;
  }
  const age = Date.now() - data.ts;
  if (age > STALE_AFTER_MS) {
    pulse.className = "pulse stale";
    text.textContent = `данные устарели — последние ${fmtTime(data.ts)}`;
  } else {
    pulse.className = "pulse";
    text.textContent = `обновлено ${fmtTime(data.ts)}`;
  }
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

async function tickCurrent() {
  try {
    const data = await getJSON("current");
    if (!data || !data.channels) {
      $("note").textContent = "Панель ещё не прислала данные. Проверь, запущен ли gateway.py.";
      return;
    }
    latest = data;
    renderRows(data);
    renderLink(data, null);
    $("note").textContent = `Прошивка панели ${data.firmware ?? "—"}. Только чтение, настройки панели не изменяются.`;
  } catch (e) {
    renderLink(null, e);
  }
}

// ---------- график ----------

function drawChart(points) {
  const cv  = $("chart");
  const dpr = window.devicePixelRatio || 1;
  const w   = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const pad = { l: 44, r: 12, t: 14, b: 24 };

  if (!points.length || !order.length) {
    ctx.fillStyle = "#5d6873";
    ctx.font = "14px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("История накапливается", w / 2, h / 2);
    return;
  }

  let lo = Infinity, hi = -Infinity;
  for (const p of points) for (const k of order) {
    if (typeof p[k] === "number") { lo = Math.min(lo, p[k]); hi = Math.max(hi, p[k]); }
  }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (hi - lo < 0.1) { hi = lo + 0.1; }
  const padY = (hi - lo) * 0.12;
  lo -= padY; hi += padY;

  const t0 = points[0].ts, t1 = points[points.length - 1].ts || t0 + 1;
  const X = t => pad.l + (t - t0) / Math.max(1, t1 - t0) * (w - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (h - pad.t - pad.b);

  // сетка
  ctx.strokeStyle = "#e3e9ee";
  ctx.fillStyle   = "#5d6873";
  ctx.font        = "11.5px system-ui, sans-serif";
  ctx.lineWidth   = 1;
  ctx.textAlign   = "right";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4;
    const y = Math.round(Y(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(v.toFixed(2), pad.l - 8, y + 4);
  }

  ctx.textAlign = "center";
  ctx.fillText(fmtTime(t0), pad.l + 22, h - 7);
  ctx.fillText(fmtTime(t1), w - pad.r - 22, h - 7);

  // линии
  order.forEach((key, i) => {
    ctx.strokeStyle = LINE_COLORS[i % LINE_COLORS.length];
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.beginPath();
    let started = false;
    for (const p of points) {
      if (typeof p[key] !== "number") { started = false; continue; }
      const x = X(p.ts), y = Y(p[key]);
      started ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      started = true;
    }
    ctx.stroke();
  });
}

async function tickHistory() {
  try {
    const raw = await getJSON("history");
    if (!raw) { drawChart([]); return; }
    const points = Object.values(raw)
      .filter(p => p && typeof p.ts === "number")
      .sort((a, b) => a.ts - b.ts);
    drawChart(points);
  } catch (e) {
    drawChart([]);
  }
}

// ---------- запуск ----------

if (FIREBASE_URL.includes("ЗАМЕНИ-МЕНЯ")) {
  $("rows").innerHTML = '<div class="empty">Впиши адрес базы Firebase в начале скрипта этой страницы.</div>';
} else {
  tickCurrent();
  tickHistory();
  setInterval(tickCurrent, CURRENT_EVERY_MS);
  setInterval(tickHistory, HISTORY_EVERY_MS);
  window.addEventListener("resize", () => tickHistory());
}
</script>
</body>
</html>
